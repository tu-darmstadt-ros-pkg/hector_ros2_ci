name: Build & Test

on:
  workflow_call:
    inputs:
      rosdistro:
        description: ROS 2 distribution to build against.
        type: string
        default: jazzy
      runner:
        description: GitHub runner label (e.g. ubuntu-24.04-arm for arm64).
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build & Test (${{ inputs.rosdistro }})
    runs-on: ${{ inputs.runner }}
    container:
      image: ros:${{ inputs.rosdistro }}-ros-base
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/${{ github.event.repository.name }}

      - name: Add Hector apt and rosdep sources
        run: |
          . /etc/os-release
          # Public signing key of deb.teamhector.de (same as hector workspace .install-files/hector.sources)
          cat > /etc/apt/sources.list.d/hector.sources <<EOF
          Types: deb
          URIs: http://deb.teamhector.de/ubuntu
          Suites: ${VERSION_CODENAME}
          Components: main
          Signed-By: -----BEGIN PGP PUBLIC KEY BLOCK-----
