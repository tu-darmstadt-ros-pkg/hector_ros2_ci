          mkdir -p /etc/ros/rosdep/sources.list.d
          echo "yaml http://deb.teamhector.de/rosdep/hector.yaml" > /etc/ros/rosdep/sources.list.d/10-hector.list
          apt-get update
          rosdep update --rosdistro "${{ inputs.rosdistro }}"

          # Environment for later steps: ROS underlay, Hector packages (/opt/hector) on top
          cat > /etc/hector_ci_env.bash <<'EOF'
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          HECTOR_PREFIX="/opt/hector/${ROS_DISTRO}"
          if [ -d "$HECTOR_PREFIX" ]; then
            export AMENT_PREFIX_PATH="$HECTOR_PREFIX:$AMENT_PREFIX_PATH"
            export CMAKE_PREFIX_PATH="$HECTOR_PREFIX${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
            export PATH="$HECTOR_PREFIX/bin:$PATH"
            export LD_LIBRARY_PATH="$HECTOR_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            for d in "$HECTOR_PREFIX"/lib/python3*/site-packages; do
              if [ -d "$d" ]; then export PYTHONPATH="$d${PYTHONPATH:+:$PYTHONPATH}"; fi
            done
          fi
          EOF

      - name: Install dependencies
        run: rosdep install -y --from-paths src --ignore-src --rosdistro "${{ inputs.rosdistro }}"

      - name: Build
        run: |
          source /etc/hector_ci_env.bash
          colcon build --event-handlers console_direct+

      - name: Test
        run: |
          source /etc/hector_ci_env.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
