name: pre-commit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.x"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Used by the cppcheck hook (language: system) in most Hector repositories
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure --color=always
